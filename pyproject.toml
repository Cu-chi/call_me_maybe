[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Introduction to function calling in LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "flake8>=7.3.0",
    "llm-sdk",
    "mypy>=1.20.2",
    "numpy>=2.4.4",
    "pydantic>=2.13.3",
    "rich>=15.0.0",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }

[tool.mypy]
exclude = [".venv","llm_sdk"]

[[tool.mypy.overrides]]
module = [
    "llm_sdk",
    "llm_sdk.*"
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "src.model"
disallow_subclassing_any = false
